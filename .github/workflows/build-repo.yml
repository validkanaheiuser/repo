name: Build Sileo APT Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils xz-utils gzip

      - name: Generate Packages indexes
        shell: bash
        run: |
          set -euo pipefail

          rm -f Packages Packages.gz Packages.xz

          # Scan every .deb below pool/.
          # -m allows multiple versions of the same package.
          dpkg-scanpackages -m pool /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          xz -9 -c Packages > Packages.xz

          echo "Generated package index:"
          grep -E '^(Package|Version|Architecture|Filename):' Packages || true

      - name: Generate Release
        shell: bash
        run: |
          set -euo pipefail

          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release {
            Origin "My Sileo Repo";
            Label "My Sileo Repo";
            Suite "stable";
            Codename "stable";
            Architectures "iphoneos-arm64e iphoneos-arm";
            Components "main";
            Description "Personal Sileo APT Repository";
          };
          EOF

          apt-ftparchive -c=apt-ftparchive.conf release . > Release

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/repo-pages
          mkdir -p /tmp/repo-pages

          # Copy repository files required by the APT source.
          cp -f Packages Packages.gz Packages.xz Release /tmp/repo-pages/
          cp -rf pool /tmp/repo-pages/
          [ -f index.html ] && cp -f index.html /tmp/repo-pages/ || true

          cd /tmp/repo-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy APT repository"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
